<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 320" width="1180" height="320"
     role="img" aria-label="Emissary">
  <title>Emissary</title>
  <defs>
    <linearGradient id="sealLockup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E3AF0"/>
      <stop offset="1" stop-color="#3D1B9E"/>
    </linearGradient>
  </defs>

  <!-- The mark, scaled from its 512 grid. -->
  <g transform="translate(0 4) scale(0.6094)">
    <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#sealLockup)"/>
    <rect x="140" y="314" width="232" height="46" rx="23" fill="#D97757"/>
    <g fill="#FFFFFF">
      <rect x="140" y="152" width="232" height="46" rx="23"/>
      <rect x="140" y="233" width="168" height="46" rx="23"/>
      <rect x="140" y="152" width="46" height="208" rx="23"/>
    </g>
  </g>

  <!-- Violet reads on both a white and a dark background, so one asset serves both GitHub themes. -->
  <text x="348" y="170" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif"
        font-size="132" font-weight="700" letter-spacing="-2" fill="#7C3AED">Emissary</text>
  <text x="352" y="238" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif"
        font-size="46" font-weight="500" letter-spacing="1.5" fill="#8B7BB8">CLAUDE AGENTS FOR .NET</text>
</svg>
