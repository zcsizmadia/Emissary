version: 2
updates:
  # .NET / NuGet packages (central package management: Directory.Packages.props).
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "nuget"
    groups:
      # One PR for non-breaking bumps, merged automatically once CI is green (see
      # workflows/dependabot-auto-merge.yml). Majors still get individual PRs, and are never
      # auto-merged.
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used in the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # Every bump in one pull request, majors included — an action is build infrastructure, so a
      # bad one turns CI red here and never reaches anyone installing the packages.
      # workflows/dependabot-auto-merge.yml merges this group on green whatever the bump.
      github-actions:
        patterns:
          - "*"
