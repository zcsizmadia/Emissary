name: Docs

# Builds the DocFX site (conceptual guides + API reference generated from the XML docs) and
# publishes it to GitHub Pages. PRs build the site without publishing, so broken docs fail review.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build site
        run: |
          dotnet tool restore
          dotnet docfx docs/docfx.json --warningsAsErrors

      # Publishing needs GitHub Pages enabled on the repository, which the workflow token cannot
      # do for itself (creating a Pages site requires admin rights). So detect it and skip the
      # publish cleanly rather than failing a run over a setting that is not turned on yet.
      - name: Check whether Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Docs not published::GitHub Pages is not enabled for this repository. The site built successfully but was not published. Enable it once at Settings → Pages → Source: GitHub Actions."
          fi

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site

  deploy:
    # Runs only once Pages is enabled (Settings → Pages → Source: GitHub Actions). Until then the
    # build job still validates the site on every push and PR; this job is simply skipped.
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
