name: Docs

# Builds the DocFX site (conceptual guides + API reference generated from the XML docs) and
# publishes it to GitHub Pages. PRs build the site without publishing, so broken docs fail review.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build site
        run: |
          dotnet tool restore
          dotnet docfx docs/docfx.json --warningsAsErrors

      # Turns Pages on for the repository if it is not already, so the deploy job below has
      # somewhere to publish to. Without this the first deploy 404s until someone enables Pages
      # by hand in Settings.
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site

  deploy:
    # The build job enables Pages via the API, so this normally just works. If your organization
    # blocks that, enable it once by hand: Settings → Pages → Source: GitHub Actions.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
