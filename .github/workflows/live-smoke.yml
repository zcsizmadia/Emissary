name: Live smoke

# Validates the real Claude transport (streaming, tool loop, structured outputs) against the
# live API. Deliberately OFF the PR gate: it is non-deterministic, costs a few cents, and needs
# a secret forks can't see. It skips cleanly when the ANTHROPIC_API_KEY secret is not configured.
#
# Manual only, on purpose. This spends real money, and nothing should spend money on a timer that
# nobody chose to start — the key holder decides when a run happens. Restore the schedule when
# there is a reason to want unattended runs (a release candidate soak, for instance) by adding:
#
#   schedule:
#     - cron: "0 6 * * 1"   # Mondays 06:00 UTC
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Gate on API key
        id: gate
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "ANTHROPIC_API_KEY secret not set — skipping live smoke."
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.have_key == 'true'

      - uses: actions/setup-dotnet@v6
        if: steps.gate.outputs.have_key == 'true'
        with:
          dotnet-version: 10.0.x

      # The gate asserts, rather than printing output for someone to read: a strict schema
      # round-tripping, a tool call executing, a truncated answer reporting MaxTokens, and a
      # cancelled stream actually stopping. Each of those corresponds to a defect that shipped in
      # a release and that no offline test could catch (ADR 0008). It exits non-zero on failure,
      # and prints SKIPPED and exits 0 with no key, so the step needs no condition of its own.
      - name: Live gate
        if: steps.gate.outputs.have_key == 'true'
        run: dotnet run --project tests/Emissary.LiveSmoke -c Release

      # Kept as well, because a sample that stops working is a documentation bug: these two run
      # the paths a reader copies first. Cheap — both are capped to a small model.
      - name: Sample smoke (structured outputs, then the tool loop)
        if: steps.gate.outputs.have_key == 'true'
        run: |
          dotnet run --project samples/03-TypedOutputs -c Release
          dotnet run --project samples/01-HelloTool -c Release -- "Roll 2 six-sided dice and give the total."
