name: Dependabot auto-merge

# Merges Dependabot's grouped bumps once every other check on the commit has passed:
# GitHub Actions bumps of any kind, and minor/patch bumps of everything else. A NuGet major is
# left for a human, because it ships to whoever installs Emissary.
#
# Why this waits for checks itself, instead of `gh pr merge --auto`: GitHub's native auto-merge
# only waits for status checks that a branch protection rule marks as *required*. `main` has no
# protection rule, so `--auto` would merge the moment the PR is mergeable — before CI has said
# anything. Polling the commit's check runs gives "green, then merge" without requiring a repo
# settings change. If branch protection with required checks is added later, this can be replaced
# by `--auto`.
on:
  pull_request:

# Dependabot pull requests get a read-only token by default; these declarations grant the writes
# the merge needs. Nothing here runs code from the pull request.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The job name doubles as the check-run name skipped when polling below. Keep them in sync.
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read the update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Two policies, because the two ecosystems fail differently:
      #
      #   GitHub Actions — any bump, majors included. A workflow action is build infrastructure: if
      #   a new major misbehaves, CI goes red here and nothing reaches a consumer of the packages.
      #   The check gate below is the whole safety argument.
      #
      #   Everything else (NuGet) — minor and patch only. A dependency major ships to whoever
      #   installs Emissary, so it gets read first.
      #
      # For a grouped pull request the metadata reports the highest bump in the group, so a NuGet
      # group that happens to contain a major is left alone as a whole.
      - name: Decide
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        run: |
          allow=false
          case "$ECOSYSTEM" in
            # Accept both spellings; the metadata action has used each.
            github_actions|github-actions)
              allow=true
              reason="GitHub Actions bump ($UPDATE_TYPE) — CI is the gate" ;;
            *)
              case "$UPDATE_TYPE" in
                version-update:semver-patch|version-update:semver-minor)
                  allow=true
                  reason="$ECOSYSTEM $UPDATE_TYPE" ;;
                *)
                  reason="$ECOSYSTEM $UPDATE_TYPE needs a human" ;;
              esac ;;
          esac

          echo "merge=$allow" >> "$GITHUB_OUTPUT"
          if [ "$allow" = "true" ]; then
            echo "::notice::$reason — will merge once checks pass."
          else
            echo "::notice::$reason — leaving open for review."
          fi

      - name: Wait for the other checks on this commit
        if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in $(seq 1 60); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name != "auto-merge")]')
            total=$(echo "$runs" | jq 'length')
            pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            # skipped and neutral are fine: the docs workflow deliberately skips its deploy job
            # on pull requests.
            bad=$(echo "$runs" | jq -r '[.[] | select(.conclusion != null
              and .conclusion != "success"
              and .conclusion != "skipped"
              and .conclusion != "neutral")] | map(.name + ": " + .conclusion) | join(", ")')

            if [ -n "$bad" ]; then
              echo "::error::Not merging — $bad"
              exit 1
            fi

            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "All $total check(s) green."
              exit 0
            fi

            echo "attempt $attempt: $pending of $total check(s) still running"
            sleep 20
          done

          echo "::error::Timed out waiting for checks; leaving the pull request open."
          exit 1

      - name: Merge
        if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash --delete-branch "$PR_URL"
